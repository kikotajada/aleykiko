<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ale &amp; Kiko</title>
<meta name="description" content="Ale & Kiko se casan · Ale & Kiko are getting married">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF8F3">
<meta property="og:title" content="Ale & Kiko se casan">
<meta property="og:image" content="https://aleykiko.com/personajes/pareja.png">
<meta property="og:url" content="https://aleykiko.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28S3 20 3 11a6.5 6.5 0 0 1 13-1 6.5 6.5 0 0 1 13 1c0 9-13 17-13 17z' fill='%23D6338A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <a class="mono-mark" href="#top" aria-label="Inicio">A<span>&amp;</span>K</a>
  <nav>
    <button id="lang" type="button" aria-label="Change language">EN</button>
    <a class="btn small" href="#rsvp">RSVP</a>
  </nav>
</header>

<main id="top">
  <section class="hero">
    <p class="kicker" data-i18n="kicker"></p>
    <h1 id="names"></h1>
    <p class="when" id="when"></p>
    <figure class="couple">
      <img src="personajes/pareja.webp" width="629" height="966" alt="Ale y Kiko">
    </figure>
    <p class="countdown" id="countdown"></p>
    <a class="btn" href="#rsvp" data-i18n="rsvp_title"></a>
  </section>

  <section class="block" id="historia">
    <p class="kicker reveal" data-i18n="story_kicker"></p>
    <ol class="story" id="story"></ol>
  </section>

  <section class="block" id="dia">
    <p class="kicker reveal" data-i18n="day_kicker"></p>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section class="block" id="info">
    <p class="kicker reveal" data-i18n="info_kicker"></p>
    <div class="cards" id="cards"></div>
  </section>

  <section class="block" id="rsvp">
    <p class="kicker" data-i18n="rsvp_kicker"></p>
    <h2 id="rsvp-title" data-i18n="rsvp_title"></h2>
    <form class="rsvp" id="rsvp-form" novalidate>
      <p class="lead" id="rsvp-intro"></p>
      <p class="note" id="rsvp-note" hidden></p>

      <!-- Personal invitation: one card per guest -->
      <div id="party"></div>

      <!-- Generic form (no personal link) -->
      <div id="generic" hidden>
        <label class="field"><span data-i18n="f_name"></span>
          <input name="g_name" autocomplete="name"></label>
        <fieldset class="field">
          <legend data-i18n="f_attend"></legend>
          <div class="seg">
            <label><input type="radio" name="g_attending" value="yes" checked><span data-i18n="f_yes"></span></label>
            <label><input type="radio" name="g_attending" value="no"><span data-i18n="f_no"></span></label>
          </div>
        </fieldset>
        <div class="if-yes">
          <label class="field"><span data-i18n="f_count"></span>
            <input name="g_count" type="number" min="1" max="8" value="1" inputmode="numeric"></label>
          <label class="field"><span data-i18n="p_allergies"></span>
            <input name="g_allergies" data-i18n-ph="p_allergies_ph"></label>
        </div>
      </div>

      <div class="shared if-any-yes">
        <label class="field"><span data-i18n="f_bus"></span>
          <select name="bus">
            <option value="none" data-i18n="bus_none"></option>
            <option value="both" data-i18n="bus_both"></option>
            <option value="go" data-i18n="bus_go"></option>
            <option value="back" data-i18n="bus_back"></option>
          </select></label>
        <label class="field"><span data-i18n="f_song"></span>
          <input name="song"></label>
      </div>
      <label class="field"><span data-i18n="f_contact"></span>
        <input name="contact" autocomplete="tel"></label>
      <label class="field"><span data-i18n="f_msg"></span>
        <textarea name="message" rows="3"></textarea></label>

      <button class="btn wide" id="send" type="submit" data-i18n="f_send"></button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="deadline" id="deadline"></p>
    </form>
  </section>

  <section class="block narrow" id="regalo" hidden>
    <p class="kicker reveal" data-i18n="gift_kicker"></p>
    <p class="lead reveal" data-i18n="gift_text"></p>
    <div class="iban reveal">
      <div><code id="iban"></code><small id="iban-holder"></small></div>
      <button type="button" class="btn small ghost" id="copy" data-i18n="copy"></button>
    </div>
  </section>

  <section class="block" id="extras">
    <p class="kicker reveal" data-i18n="extras_kicker"></p>
    <div class="duo">
      <article class="card reveal">
        <h3 data-i18n="photos_title"></h3>
        <p data-i18n="photos_text"></p>
        <a class="link" id="album" target="_blank" rel="noopener"></a>
      </article>
      <article class="card reveal">
        <h3 data-i18n="music_title"></h3>
        <p data-i18n="music_text"></p>
        <a class="link" id="playlist" target="_blank" rel="noopener"></a>
      </article>
    </div>
  </section>
</main>

<footer class="end">
  <p class="names-small" id="names-foot"></p>
  <p data-i18n="footer"></p>
</footer>

<template id="guest-tpl">
  <fieldset class="guest">
    <div class="guest-head">
      <input class="g-name" aria-label="Nombre">
      <div class="seg">
        <label><input type="radio" value="yes"><span data-i18n="p_coming"></span></label>
        <label><input type="radio" value="no"><span data-i18n="p_notcoming"></span></label>
      </div>
    </div>
    <div class="guest-body">
      <label class="field"><span data-i18n="p_menu"></span>
        <select class="g-menu">
          <option value="Adulto" data-i18n="m_adult"></option>
          <option value="Niño" data-i18n="m_child"></option>
          <option value="Bebé" data-i18n="m_baby"></option>
        </select></label>
      <label class="field"><span data-i18n="p_allergies"></span>
        <input class="g-allergies" data-i18n-ph="p_allergies_ph"></label>
    </div>
  </fieldset>
</template>

<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
